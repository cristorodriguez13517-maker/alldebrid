<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARKTV - Películas</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 320px;
    background: #000 center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 20px;
    z-index: 999;
    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(to right, rgba(0,0,0,.9), rgba(0,0,0,.55) 35%, transparent 100%),
        linear-gradient(to bottom, transparent 35%, #000 100%);
    pointer-events: none;
}

.header-info {
    position: relative;
    z-index: 2;
    max-width: 500px;
    opacity: 0;
    transition: opacity .25s ease;
}

.header-info.visible {
    opacity: 1;
}

.header h1 {
    margin: 0;
}

.header h1 img {
    display: block;
    max-width: 300px;
    max-height: 80px;
    object-fit: contain;
    object-position: left center;
}

.details {
    font-size: 14px;
    font-weight: bold;
    margin: 10px 0;
    line-height: 1.7;
    max-width: 480px;
}

.overview {
    font-size: 12px;
    line-height: 1.45;
    max-width: 450px;
    margin: 8px 0 0;
}

.content {
    padding: 20px;
    margin-top: 320px;
    min-height: 200px;
}

.movie-row {
    display: grid;
    grid-template-columns: repeat(8, 105px);
    gap: 12px;
    margin-top: 15px;
    align-items: start;
}

.movie {
    display: block;
    width: 105px;
    height: 160px;
    cursor: pointer;
    outline: none;
    text-decoration: none;
    background: transparent;
    border: none;
    box-shadow: none;
    overflow: hidden;
    transform: translateZ(0);
}

.movie[hidden] {
    display: none !important;
}

.movie img {
    display: block;
    width: 105px;
    height: 160px;
    object-fit: cover;
    border: 3px solid transparent;
    background: transparent;
    outline: none;
    box-shadow: none;
    transition: border-color .15s;
}

.movie.selected img,
.movie:focus-visible img {
    border-color: #e50914;
}

.movie,
.movie:focus,
.movie:focus-visible,
.movie.selected {
    background: transparent !important;
    outline: none !important;
    box-shadow: none !important;
}

.movie img {
    background: transparent !important;
    box-shadow: none !important;
}

/* BUSCADOR */

.search-container {
    position: fixed;
    top: 20px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1001;
}

.search-button {
    background: transparent;
    border: 0;
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    border-radius: 50%;
    transform-origin: center;
    transition: transform .2s ease;
}

.search-button svg {
    display: block;
    width: 26px;
    height: 26px;
    fill: white;
}

.search-button:hover,
.search-button:focus,
.search-button:focus-visible {
    transform: scale(1.3);
    outline: none;
}

.search-input {
    width: 0;
    min-width: 0;
    padding: 8px 0;
    border: 0;
    border-radius: 20px;
    background: rgba(0,0,0,.9);
    color: #fff;
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: width .2s, opacity .2s, padding .2s;
}

.search-input.active {
    width: 220px;
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.5);
    opacity: 1;
    pointer-events: auto;
}

.search-input:focus {
    border-color: rgba(255,255,255,.9);
}

.status {
    color: #aaa;
    font-size: 14px;
    margin-top: 20px;
}

@media (max-width: 900px) {
    .movie-row {
        grid-template-columns: repeat(5, 105px);
    }
}

@media (max-width: 600px) {
    .header {
        height: 320px;
        padding: 15px;
    }

    .header h1 img {
        max-width: 240px;
        max-height: 70px;
    }

    .content {
        margin-top: 320px;
        padding: 12px;
    }

    .movie-row {
        grid-template-columns: repeat(3, 105px);
        gap: 10px;
    }

    .search-container {
        right: 15px;
        top: 15px;
    }

    .search-input.active {
        width: 170px;
    }
}
</style>
</head>

<body>

<!-- BUSCADOR -->

<div class="search-container">

    <button
        id="search-button"
        class="search-button"
        type="button"
        aria-label="Abrir buscador"
        tabindex="0">

        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5
            6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5
            4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5
            S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/>
        </svg>

    </button>

    <input
        id="search"
        class="search-input"
        type="text"
        placeholder="Buscar película..."
        aria-label="Buscar películas"
        autocomplete="off"
        tabindex="0">

</div>

<!-- BANNER -->

<div class="header" id="header">

    <div class="header-info" id="info">

        <h1 id="title"></h1>

        <div id="meta" class="details"></div>

        <p id="overview" class="overview"></p>

    </div>

</div>

<!-- CATÁLOGO -->

<div class="content">

    <div class="movie-row" id="movie-row"></div>

    <p class="status" id="status">
        Cargando películas...
    </p>

</div>

<script>
'use strict';

/* ELEMENTOS */

const header = document.getElementById('header');
const info = document.getElementById('info');
const titleElement = document.getElementById('title');
const metaElement = document.getElementById('meta');
const overviewElement = document.getElementById('overview');

const searchInput = document.getElementById('search');
const searchButton = document.getElementById('search-button');

const movieRow = document.getElementById('movie-row');
const statusElement = document.getElementById('status');

let movies = [];
let selectedMovie = null;


/* NORMALIZAR TEXTO PARA BUSCAR */

function normalizarTexto(texto) {

    return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('es')
        .trim();

}


/* CARGAR CATÁLOGO */

async function loadMovies() {

    statusElement.hidden = false;
    statusElement.textContent = 'Cargando películas...';

    try {

        const response = await fetch(
            './peliculas.json?t=' + Date.now(),
            { cache: 'no-store' }
        );

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const catalog = await response.json();

        if (!Array.isArray(catalog)) {
            throw new Error('El catálogo JSON no es una lista válida.');
        }

        movies = catalog;

        renderMovies();

    } catch (error) {

        console.error('Error cargando catálogo:', error);

        statusElement.hidden = false;

        statusElement.textContent =
            'No se pudo cargar peliculas.json. Comprueba que esté publicado junto a index.html.';

    }

}


/* DATOS DE LAS PELÍCULAS */

function titleOf(movie) {

    return movie.title_manual ||
        movie.title ||
        movie.youtube_title ||
        movie.name ||
        'Película';

}


function yearOf(movie) {

    if (movie.release_date) {
        return String(movie.release_date).slice(0, 4);
    }

    if (movie.year) {
        return String(movie.year);
    }

    const text = [
        movie.youtube_title,
        movie.title,
        movie.name
    ].filter(Boolean).join(' ');

    const match = text.match(/\b(19\d{2}|20\d{2})\b/);

    return match ? match[1] : '';

}


function runtimeOf(movie) {

    const runtime = Number(
        movie.runtime ||
        movie.duration_minutes ||
        0
    );

    if (!runtime || runtime <= 0) {
        return '';
    }

    const hours = Math.floor(runtime / 60);
    const minutes = runtime % 60;

    if (hours && minutes) {
        return hours + 'h ' + minutes + 'm';
    }

    if (hours) {
        return hours + 'h';
    }

    return minutes + 'm';

}


function genresOf(movie) {

    if (Array.isArray(movie.genres)) {

        return movie.genres.map(genre => {

            if (typeof genre === 'string') {
                return genre;
            }

            return genre && genre.name ? genre.name : '';

        }).filter(Boolean).join(', ');

    }

    if (typeof movie.genres === 'string') {
        return movie.genres;
    }

    return movie.genre || movie.genre_label || '';

}


function qualityOf(movie) {

    return movie.quality_manual ||
        movie.quality ||
        '';

}


function ageOf(movie) {

    let age =
        movie.age_rating_manual ||
        movie.age_rating ||
        movie.age_certification ||
        movie.certification ||
        '';

    if (age && !String(age).endsWith('+')) {
        age = String(age) + '+';
    }

    return age;

}


function posterOf(movie) {

    return movie.poster_manual ||
        movie.poster ||
        '';

}


function logoOf(movie) {

    return movie.logo_manual ||
        movie.logo ||
        movie.movie_logo ||
        '';

}


function bannerOf(movie) {

    return movie.backdrop_manual ||
        movie.backdrop ||
        '';

}


function streamOf(movie) {

    return movie.stream_url_manual ||
        movie.stream_url ||
        movie.url ||
        '';

}


/* ABRIR VLC EN ANDROID */

function abrirVLC(url) {

    if (!url) {

        alert('No hay enlace de reproducción para esta película.');

        return;

    }

    try {

        const media = new URL(url);

        if (
            media.protocol !== 'https:' &&
            media.protocol !== 'http:'
        ) {

            alert('El enlace de reproducción no es válido.');

            return;

        }

        const intent =
            'intent://' +
            media.host +
            media.pathname +
            media.search +
            '#Intent;scheme=' +
            media.protocol.replace(':', '') +
            ';package=org.videolan.vlc;type=video/*;end';

        window.location.href = intent;

    } catch (error) {

        console.error('Error abriendo VLC:', error);

        alert('No se pudo abrir el enlace en VLC.');

    }

}


/* CREAR CARÁTULAS */

function renderMovies() {

    movieRow.replaceChildren();

    selectedMovie = null;

    if (!movies.length) {

        statusElement.hidden = false;

        statusElement.textContent =
            'Todavía no hay películas disponibles.';

        limpiarBanner();

        return;

    }

    statusElement.hidden = true;

    movies.forEach(movie => {

        if (!movie || typeof movie !== 'object') {
            return;
        }

        const card = document.createElement('a');

        card.className = 'movie';
        card.href = '#';
        card.tabIndex = 0;

        /* DATOS VISIBLES */

        card.dataset.title = titleOf(movie);

        card.dataset.year = yearOf(movie);

        card.dataset.runtime = runtimeOf(movie);

        card.dataset.genres = genresOf(movie);

        card.dataset.quality = qualityOf(movie);

        card.dataset.age = ageOf(movie);

        card.dataset.logo = logoOf(movie);

        card.dataset.banner = bannerOf(movie);

        card.dataset.poster = posterOf(movie);

        card.dataset.overview = movie.overview || '';

        card.dataset.stream = streamOf(movie);


        /* DATOS ADICIONALES PARA EL BUSCADOR */

        card.dataset.youtubeTitle = movie.youtube_title || '';

        card.dataset.originalTitle =
            movie.original_title ||
            movie.original_name ||
            '';

        card.dataset.description = movie.description || '';

        card.dataset.fileName =
            movie.file_name ||
            movie.filename ||
            movie.file_path ||
            '';

        card.dataset.tmdbId = movie.tmdb_id || '';

        card.dataset.alternativeTitle =
            movie.alternative_title ||
            movie.title_original ||
            '';


        /* IMAGEN */

        const poster = document.createElement('img');

        poster.alt = '';

        poster.loading = 'lazy';

        poster.decoding = 'async';

        poster.draggable = false;

        if (card.dataset.poster) {

            poster.src = card.dataset.poster;

        } else {

            poster.style.visibility = 'hidden';

        }

        poster.addEventListener('error', () => {

            poster.style.visibility = 'hidden';

        });


        card.appendChild(poster);

        movieRow.appendChild(card);


        /* SELECCIÓN */

        card.addEventListener('focus', () => {

            selectMovie(card);

        });

        card.addEventListener('mouseenter', () => {

            selectMovie(card);

        });


        /* CLIC PARA VLC */

        card.addEventListener('click', event => {

            event.preventDefault();

            selectMovie(card);

            abrirVLC(card.dataset.stream);

        });

    });


    filterMovies();

}


/* LIMPIAR BANNER */

function limpiarBanner() {

    selectedMovie = null;

    header.style.backgroundImage = 'none';

    info.classList.remove('visible');

    titleElement.replaceChildren();

    metaElement.textContent = '';

    overviewElement.textContent = '';

    movieRow.querySelectorAll('.movie').forEach(card => {

        card.classList.remove('selected');

    });

}


/* SELECCIONAR PELÍCULA */

function selectMovie(card) {

    if (!card || card.hidden) {
        return;
    }

    selectedMovie = card;

    movieRow.querySelectorAll('.movie').forEach(movie => {

        movie.classList.toggle('selected', movie === card);

    });


    /* BANNER */

    const banner = card.dataset.banner;

    header.style.backgroundImage = banner
        ? 'url("' + banner.replace(/"/g, '%22') + '")'
        : 'none';


    /* LOGO O TÍTULO */

    const movieTitle = card.dataset.title || 'Película';

    const logo = card.dataset.logo;

    titleElement.replaceChildren();

    if (logo) {

        const image = document.createElement('img');

        image.src = logo;

        image.alt = movieTitle;

        image.addEventListener('error', () => {

            titleElement.replaceChildren();

            titleElement.textContent = movieTitle;

        }, { once: true });

        titleElement.appendChild(image);

    } else {

        titleElement.textContent = movieTitle;

    }


    /* METADATOS */

    metaElement.textContent = [

        card.dataset.year,

        card.dataset.runtime,

        card.dataset.genres,

        card.dataset.quality,

        card.dataset.age

    ].filter(Boolean).join(' | ');


    /* SINOPSIS */

    overviewElement.textContent = card.dataset.overview || '';

    info.classList.add('visible');

}


/* TARJETAS VISIBLES */

function visibleCards() {

    return [
        ...movieRow.querySelectorAll('.movie:not([hidden])')
    ];

}


/* COLUMNAS SEGÚN PANTALLA */

function columns() {

    if (window.innerWidth <= 600) {
        return 3;
    }

    if (window.innerWidth <= 900) {
        return 5;
    }

    return 8;

}


/* DESPLAZAMIENTO AUTOMÁTICO */

function scrollToCard(card) {

    if (!card) {
        return;
    }

    const rect = card.getBoundingClientRect();

    const topLimit = 325;

    const bottomLimit = window.innerHeight - 12;

    if (rect.top < topLimit) {

        window.scrollBy(0, rect.top - topLimit);

    } else if (rect.bottom > bottomLimit) {

        window.scrollBy(0, rect.bottom - bottomLimit);

    }

}


/* DAR FOCO A UNA CARÁTULA */

function focusCard(card) {

    if (!card || card.hidden) {
        return;
    }

    card.focus({ preventScroll: true });

    selectMovie(card);

    scrollToCard(card);

}


/* PRIMERA PELÍCULA */

function firstCard() {

    const cards = visibleCards();

    if (cards.length) {

        focusCard(cards[0]);

    }

}


/* ABRIR BUSCADOR */

function openSearch() {

    searchInput.classList.add('active');

    searchInput.focus();

}


/* CERRAR BUSCADOR */

function closeSearch() {

    searchInput.value = '';

    filterMovies();

    searchInput.classList.remove('active');

    searchInput.blur();

    searchButton.focus({ preventScroll: true });

}


/* BUSCADOR CORREGIDO */

function filterMovies() {

    const query = normalizarTexto(searchInput.value);

    const cards = [
        ...movieRow.querySelectorAll('.movie')
    ];

    let firstMatch = null;

    let totalMatches = 0;


    cards.forEach(card => {

        const searchableText = [

            card.dataset.title,

            card.dataset.youtubeTitle,

            card.dataset.originalTitle,

            card.dataset.alternativeTitle,

            card.dataset.year,

            card.dataset.genres,

            card.dataset.quality,

            card.dataset.age,

            card.dataset.overview,

            card.dataset.description,

            card.dataset.fileName,

            card.dataset.tmdbId

        ].join(' ');


        const text = normalizarTexto(searchableText);

        const matches = text.includes(query);

        card.hidden = !matches;


        if (matches) {

            totalMatches++;

            if (!firstMatch) {
                firstMatch = card;
            }

        }

    });


    /* RESULTADOS ENCONTRADOS */

    if (firstMatch) {

        statusElement.hidden = true;

        selectMovie(firstMatch);

    }


    /* NINGÚN RESULTADO */

    else if (query) {

        selectedMovie = null;

        limpiarBanner();

        statusElement.hidden = false;

        statusElement.textContent =
            'No se han encontrado películas.';

    }


    /* BÚSQUEDA VACÍA */

    else {

        statusElement.hidden = true;

        if (firstMatch) {

            selectMovie(firstMatch);

        }

    }


    return totalMatches;

}


/* EVENTOS DEL BUSCADOR */

searchButton.addEventListener('click', openSearch);

searchInput.addEventListener('input', filterMovies);


/* NAVEGACIÓN CON MANDO */

document.addEventListener('keydown', event => {

    const key = event.key;

    const code = event.keyCode || event.which;

    const up =
        key === 'ArrowUp' ||
        code === 38 ||
        code === 19;

    const down =
        key === 'ArrowDown' ||
        code === 40 ||
        code === 20;

    const left =
        key === 'ArrowLeft' ||
        code === 37 ||
        code === 21;

    const right =
        key === 'ArrowRight' ||
        code === 39 ||
        code === 22;

    const enter =
        key === 'Enter' ||
        code === 13 ||
        code === 23 ||
        code === 66;

    const back =
        key === 'Escape' ||
        code === 27 ||
        code === 4;


    const active = document.activeElement;

    const isSearchInput = active === searchInput;

    const isSearchButton = active === searchButton;


    /* CUANDO ESTAMOS ESCRIBIENDO */

    if (isSearchInput) {

        if (back) {

            event.preventDefault();

            closeSearch();

            return;

        }

        if (up) {

            event.preventDefault();

            searchButton.focus({ preventScroll: true });

            return;

        }

        if (down) {

            event.preventDefault();

            firstCard();

            return;

        }

        if (enter) {

            event.preventDefault();

            firstCard();

            return;

        }

        return;

    }


    /* ICONO DEL BUSCADOR */

    if (isSearchButton) {

        if (enter) {

            event.preventDefault();

            openSearch();

            return;

        }

        if (down) {

            event.preventDefault();

            firstCard();

            return;

        }

        if (up || left || right) {

            event.preventDefault();

            return;

        }

    }


    /* TARJETA ACTIVA */

    const activeCard = active && active.closest
        ? active.closest('.movie')
        : null;


    /* SI NO HAY TARJETA SELECCIONADA */

    if (!activeCard) {

        if (up || left) {

            event.preventDefault();

            searchButton.focus({ preventScroll: true });

        } else if (down || right) {

            event.preventDefault();

            firstCard();

        }

        return;

    }


    const cards = visibleCards();

    const index = cards.indexOf(activeCard);

    if (index < 0) {

        event.preventDefault();

        firstCard();

        return;

    }


    const cols = columns();

    let next = index;


    /* ENTER: REPRODUCIR */

    if (enter) {

        event.preventDefault();

        abrirVLC(activeCard.dataset.stream);

        return;

    }


    /* ATRÁS */

    if (back) {

        event.preventDefault();

        searchButton.focus({ preventScroll: true });

        return;

    }


    /* DERECHA */

    if (right) {

        next = Math.min(index + 1, cards.length - 1);

    }


    /* IZQUIERDA */

    else if (left) {

        next = index % cols === 0
            ? index
            : index - 1;

    }


    /* ABAJO */

    else if (down) {

        next = Math.min(index + cols, cards.length - 1);

    }


    /* ARRIBA */

    else if (up) {

        if (index < cols) {

            event.preventDefault();

            searchButton.focus({ preventScroll: true });

            return;

        }

        next = index - cols;

    }

    else {

        return;

    }


    event.preventDefault();

    if (cards[next]) {

        focusCard(cards[next]);

    }

}, true);


/* REDIMENSIONAR */

window.addEventListener('resize', () => {

    if (selectedMovie && !selectedMovie.hidden) {

        selectMovie(selectedMovie);

    }

});


/* INICIAR SHARKTV */

async function iniciar() {

    await loadMovies();

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            firstCard();

        });

    });

}


iniciar();

</script>

</body>
</html>
