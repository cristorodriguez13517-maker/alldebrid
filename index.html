<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARKTV - Películas</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;left:0;width:100%;height:320px;background:#000 center/cover no-repeat;display:flex;align-items:center;padding:20px;z-index:999;overflow:hidden}
.header:before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.9),rgba(0,0,0,.55) 35%,transparent),linear-gradient(to bottom,transparent 35%,#000);pointer-events:none}
.header-info{position:relative;z-index:2;max-width:500px;opacity:0;transition:opacity .25s}
.header-info.visible{opacity:1}
.header h1{margin:0}
.header h1 img{display:block;max-width:300px;max-height:80px;object-fit:contain;object-position:left}
.details{font-size:14px;font-weight:bold;margin:10px 0;line-height:1.7;max-width:480px}
.overview{font-size:12px;line-height:1.45;max-width:450px;margin:8px 0 0}
.content{padding:20px;margin-top:320px;min-height:200px}
.movie-row{display:grid;grid-template-columns:repeat(8,105px);gap:12px;margin-top:15px;align-items:start}
.movie{display:block;width:105px;height:160px;cursor:pointer;outline:none;text-decoration:none;background:transparent;border:0;overflow:hidden}
.movie[hidden]{display:none!important}
.movie img{display:block;width:105px;height:160px;object-fit:cover;border:3px solid transparent;background:transparent;transition:border-color .15s}
.movie.selected img,.movie:focus-visible img{border-color:#e50914}
.movie,.movie:focus,.movie:focus-visible,.movie.selected{background:transparent!important;outline:none!important;box-shadow:none!important}
.search-container{position:fixed;top:20px;right:30px;display:flex;align-items:center;gap:10px;z-index:1001}
.search-button{background:transparent;border:0;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;border-radius:50%;transition:transform .2s}
.search-button svg{width:26px;height:26px;fill:#fff}
.search-button:hover,.search-button:focus{transform:scale(1.3)}
.search-input{width:0;min-width:0;padding:8px 0;border:0;border-radius:20px;background:rgba(0,0,0,.9);color:#fff;outline:none;opacity:0;pointer-events:none;transition:width .2s,opacity .2s,padding .2s}
.search-input.active{width:220px;padding:9px 12px;border:1px solid rgba(255,255,255,.5);opacity:1;pointer-events:auto}
.status{color:#aaa;font-size:14px;margin-top:20px}
@media(max-width:900px){.movie-row{grid-template-columns:repeat(5,105px)}}
@media(max-width:600px){
.header{height:320px;padding:15px}
.header h1 img{max-width:240px;max-height:70px}
.content{margin-top:320px;padding:12px}
.movie-row{grid-template-columns:repeat(3,105px);gap:10px}
.search-container{right:15px;top:15px}
.search-input.active{width:170px}
}
</style>
</head>

<body>

<div class="search-container">
    <button id="search-button" class="search-button" type="button" aria-label="Buscar">
        <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5
            6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5
            4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5
            S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/>
        </svg>
    </button>
    <input id="search" class="search-input" type="text"
        placeholder="Buscar película..." autocomplete="off">
</div>

<div class="header" id="header">
    <div class="header-info" id="info">
        <h1 id="title"></h1>
        <div id="meta" class="details"></div>
        <p id="overview" class="overview"></p>
    </div>
</div>

<div class="content">
    <div class="movie-row" id="movie-row"></div>
    <p class="status" id="status">Cargando películas...</p>
</div>

<script>
'use strict';

const header=document.getElementById('header');
const info=document.getElementById('info');
const titleElement=document.getElementById('title');
const metaElement=document.getElementById('meta');
const overviewElement=document.getElementById('overview');
const searchInput=document.getElementById('search');
const searchButton=document.getElementById('search-button');
const movieRow=document.getElementById('movie-row');
const statusElement=document.getElementById('status');

let movies=[];
let selectedMovie=null;

async function loadMovies(){
    try{
        const response=await fetch('./peliculas.json?t='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);

        const data=await response.json();
        if(!Array.isArray(data))throw new Error('Formato JSON incorrecto');

        movies=data;
        renderMovies();

    }catch(error){
        console.error(error);
        statusElement.hidden=false;
        statusElement.textContent='No se pudo cargar peliculas.json.';
    }
}

function titleOf(movie){
    return movie.title_manual||movie.title||movie.youtube_title||'Película';
}

function yearOf(movie){
    return movie.release_date
        ?String(movie.release_date).slice(0,4)
        :'';
}

function runtimeOf(movie){
    const n=Number(movie.runtime||0);
    if(!n)return '';
    const h=Math.floor(n/60);
    const m=n%60;
    if(h&&m)return h+'h '+m+'m';
    if(h)return h+'h';
    return m+'m';
}

function genresOf(movie){
    if(Array.isArray(movie.genres)){
        return movie.genres.map(x=>typeof x==='string'?x:x.name||'')
            .filter(Boolean).join(', ');
    }
    return movie.genres||'';
}

function qualityOf(movie){
    return movie.quality_manual||movie.quality||'';
}

function ageOf(movie){
    let age=movie.age_rating_manual||movie.age_rating||'';
    if(age&&!String(age).endsWith('+'))age=String(age)+'+';
    return age;
}

function posterOf(movie){
    return movie.poster_manual||movie.poster||'';
}

function logoOf(movie){
    return movie.logo_manual||movie.logo||'';
}

function bannerOf(movie){
    return movie.backdrop_manual||movie.backdrop||'';
}

function streamOf(movie){
    return movie.stream_url_manual||movie.stream_url||movie.url||'';
}

/* ABRIR VLC EN ANDROID */

function abrirVLC(url){
    if(!url){
        alert('No hay enlace de reproducción para esta película.');
        return;
    }

    try{
        const media=new URL(url);

        if(media.protocol!=='https:'&&media.protocol!=='http:'){
            alert('El enlace de reproducción no es válido.');
            return;
        }

        /* Android: enviar el enlace directamente a VLC */
        const intent=
            'intent://'+media.host+media.pathname+media.search+
            '#Intent;scheme='+media.protocol.replace(':','')+
            ';package=org.videolan.vlc;type=video/*;end';

        window.location.href=intent;

    }catch(error){
        console.error(error);
        alert('No se pudo abrir el enlace en VLC.');
    }
}

function renderMovies(){
    movieRow.replaceChildren();
    selectedMovie=null;

    if(!movies.length){
        statusElement.hidden=false;
        statusElement.textContent='Todavía no hay películas disponibles.';
        return;
    }

    statusElement.hidden=true;

    movies.forEach(movie=>{
        const card=document.createElement('a');
        card.className='movie';
        card.href='#';
        card.tabIndex=0;

        card.dataset.title=titleOf(movie);
        card.dataset.year=yearOf(movie);
        card.dataset.runtime=runtimeOf(movie);
        card.dataset.genres=genresOf(movie);
        card.dataset.quality=qualityOf(movie);
        card.dataset.age=ageOf(movie);
        card.dataset.logo=logoOf(movie);
        card.dataset.banner=bannerOf(movie);
        card.dataset.overview=movie.overview||'';
        card.dataset.stream=streamOf(movie);

        const img=document.createElement('img');
        img.alt='';
        img.loading='lazy';
        img.draggable=false;
        img.src=posterOf(movie);

        img.onerror=()=>img.style.visibility='hidden';

        card.appendChild(img);
        movieRow.appendChild(card);

        card.addEventListener('focus',()=>selectMovie(card));
        card.addEventListener('click',event=>{
            event.preventDefault();
            selectMovie(card);
            abrirVLC(card.dataset.stream);
        });
    });

    filterMovies();
}

function selectMovie(card){
    if(!card||card.hidden)return;

    selectedMovie=card;

    document.querySelectorAll('.movie').forEach(x=>{
        x.classList.toggle('selected',x===card);
    });

    const banner=card.dataset.banner;
    header.style.backgroundImage=banner?'url("'+banner+'")':'none';

    titleElement.replaceChildren();

    if(card.dataset.logo){
        const img=document.createElement('img');
        img.src=card.dataset.logo;
        img.alt=card.dataset.title;
        img.onerror=()=>{
            titleElement.replaceChildren();
            titleElement.textContent=card.dataset.title;
        };
        titleElement.appendChild(img);
    }else{
        titleElement.textContent=card.dataset.title;
    }

    metaElement.textContent=[
        card.dataset.year,
        card.dataset.runtime,
        card.dataset.genres,
        card.dataset.quality,
        card.dataset.age
    ].filter(Boolean).join(' | ');

    overviewElement.textContent=card.dataset.overview;
    info.classList.add('visible');
}

function visibleCards(){
    return [...movieRow.querySelectorAll('.movie:not([hidden])')];
}

function columns(){
    if(innerWidth<=600)return 3;
    if(innerWidth<=900)return 5;
    return 8;
}

function focusCard(card){
    if(!card)return;
    card.focus({preventScroll:true});
    selectMovie(card);

    const r=card.getBoundingClientRect();
    if(r.top<325)scrollBy(0,r.top-325);
    else if(r.bottom>innerHeight-12)scrollBy(0,r.bottom-innerHeight+12);
}

function firstCard(){
    const cards=visibleCards();
    if(cards.length)focusCard(cards[0]);
}

function openSearch(){
    searchInput.classList.add('active');
    searchInput.focus();
}

function closeSearch(){
    searchInput.value='';
    filterMovies();
    searchInput.classList.remove('active');
    searchInput.blur();
    searchButton.focus({preventScroll:true});
}

function filterMovies(){
    const q=searchInput.value.toLocaleLowerCase('es').trim();
    let first=null;

    document.querySelectorAll('.movie').forEach(card=>{
        const text=[
            card.dataset.title,card.dataset.year,
            card.dataset.genres,card.dataset.quality,
            card.dataset.age,card.dataset.overview
        ].join(' ').toLocaleLowerCase('es');

        card.hidden=!text.includes(q);
        if(!card.hidden&&!first)first=card;
    });

    if(first)selectMovie(first);
    else if(q){
        info.classList.remove('visible');
        selectedMovie=null;
    }
}

searchButton.addEventListener('click',openSearch);
searchInput.addEventListener('input',filterMovies);

document.addEventListener('keydown',event=>{
    const key=event.key;
    const code=event.keyCode||event.which;

    const up=key==='ArrowUp'||code===38||code===19;
    const down=key==='ArrowDown'||code===40||code===20;
    const left=key==='ArrowLeft'||code===37||code===21;
    const right=key==='ArrowRight'||code===39||code===22;
    const enter=key==='Enter'||code===13||code===23||code===66;
    const back=key==='Escape'||code===27||code===4;

    const active=document.activeElement;

    if(active===searchInput){
        if(back){
            event.preventDefault();
            closeSearch();
        }else if(down||enter){
            event.preventDefault();
            firstCard();
        }else if(up){
            event.preventDefault();
            searchButton.focus();
        }
        return;
    }

    if(active===searchButton){
        if(enter){
            event.preventDefault();
            openSearch();
        }else if(down){
            event.preventDefault();
            firstCard();
        }
        return;
    }

    const card=active.closest&&active.closest('.movie');

    if(!card){
        if(down||right){
            event.preventDefault();
            firstCard();
        }else if(up||left){
            event.preventDefault();
            searchButton.focus();
        }
        return;
    }

    const cards=visibleCards();
    const index=cards.indexOf(card);
    const cols=columns();
    let next=index;

    if(enter){
        event.preventDefault();
        abrirVLC(card.dataset.stream);
        return;
    }

    if(back){
        event.preventDefault();
        searchButton.focus();
        return;
    }

    if(right)next=Math.min(index+1,cards.length-1);
    else if(left)next=index%cols===0?index:index-1;
    else if(down)next=Math.min(index+cols,cards.length-1);
    else if(up){
        if(index<cols){
            event.preventDefault();
            searchButton.focus();
            return;
        }
        next=index-cols;
    }else return;

    event.preventDefault();
    focusCard(cards[next]);
},true);

async function iniciar(){
    await loadMovies();
    requestAnimationFrame(()=>requestAnimationFrame(firstCard));
}

iniciar();
</script>
</body>
</html>
