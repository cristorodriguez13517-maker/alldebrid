<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHARKTV · Prueba YouTube</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:12px}
h1{font-size:16px;font-weight:500;margin:0}
.player{width:min(100%,960px);aspect-ratio:16/9;background:#111}
iframe{display:block;width:100%;height:100%;border:0}
p{font-size:13px;color:#bbb;margin:0;text-align:center}
</style>
</head>
<body>
<main>
<h1>Prueba directa de YouTube (sin SHARKTV)</h1>
<div class="player">
<iframe
 src="https://www.youtube.com/embed/NwUZt8H3UBc?playsinline=1&controls=1&rel=0"
 title="Reproductor de YouTube"
 allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
 referrerpolicy="strict-origin-when-cross-origin"
 allowfullscreen>
</iframe>
</div>
<p>Si aquí aparece la imagen y se oye el sonido, el vídeo funciona fuera de la interfaz SHARKTV.</p>
</main>
</body>
</html>
