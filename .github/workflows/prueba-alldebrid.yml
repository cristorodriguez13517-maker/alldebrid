name: PRUEBA DESBLOQUEO ALLDEBRID

on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Probar generacion de enlace directo
        env:
          ALLDEBRID_API_KEY: ${{ secrets.ALLDEBRID_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = "https://alldebrid.com/f/F_7g_tBku2OidUqnGAXUkY8zbM8stpwfnAe0sDC9K18"

          respuesta = requests.post(
              "https://api.alldebrid.com/v4/link/unlock",
              headers={
                  "Authorization": "Bearer " + os.environ["ALLDEBRID_API_KEY"]
              },
              data={"link": url},
              timeout=60
          )

          datos = respuesta.json()

          print("--------------------------------")
          print("PRUEBA DE DESBLOQUEO")
          print("--------------------------------")
          print("HTTP:", respuesta.status_code)
          print("RESULTADO:", datos.get("status"))

          if datos.get("status") == "success":
              resultado = datos.get("data", {})

              if resultado.get("link"):
                  print("ENLACE DIRECTO: GENERADO")
                  print("HOST:", resultado.get("host"))
                  print("ARCHIVO:", resultado.get("filename"))
              elif resultado.get("delayed"):
                  print("ENLACE PENDIENTE")
                  print("ID DIFERIDO:", resultado.get("delayed"))
              else:
                  print("RESPUESTA:", resultado.keys())
          else:
              error = datos.get("error", {})
              print("CODIGO:", error.get("code"))
              print("MENSAJE:", error.get("message"))
          PY
