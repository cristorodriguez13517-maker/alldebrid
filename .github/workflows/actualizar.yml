name: Actualizar catalogo SHARKTV ALLDEBRID

on:
workflow_dispatch:

schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

jobs:
actualizar:
runs-on: ubuntu-latest

steps:
- name: Descargar repositorio
uses: actions/checkout@v4

- name: Preparar Python
uses: actions/setup-python@v5
with:
python-version: "3.12"

- name: Instalar dependencias
run: |
pip install requests

- name: Actualizar catalogos
env:
ALLDEBRID_API_KEY:  {{ secrets.TMDB_API_KEY }}
run: |
python actualizar.py

- name: Guardar cambios
run: |
git config user.name "SHARKTV"
git config user.email "sharktv@users.noreply.github.com"
git add peliculas.json series.json episodios.json
git diff --cached --quiet || (
git commit -m "Actualizar catalogos AllDebrid"
git push
)
